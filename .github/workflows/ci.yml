name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/sentence_transformers
          key: st-models-${{ hashFiles('backend/embed_utils.py') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          cd frontend && npm ci
      - name: Type-check and lint the renderer
        run: |
          cd frontend
          npm run typecheck
          npm run lint
      - name: Build renderer and Electron main
        run: npm run build
